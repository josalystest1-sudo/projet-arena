# Réglage de l'équilibrage sur les machines de GitHub (gratuites pour un dépôt public), en parallèle.
# À lancer depuis l'onglet Actions (bouton « Run workflow ») : chaque passe fait jouer des centaines de milliers de
# combats répartis sur plusieurs machines, puis tools/regleur.py corrige les chiffres de data/ ; les passes
# s'enchaînent. À la fin : une vérification sur des combats neufs (rapport dans le résumé du run) et une branche
# « reglage-<numéro> » qui porte les données réglées, à fusionner dans la branche de travail.
name: Réglage de l'équilibrage (simulation sur GitHub)

on:
  workflow_dispatch:
    inputs:
      passes:
        description: "Nombre de passes de réglage (1 à 6)"
        default: "4"
      combats:
        description: "Combats par passe (répartis sur les machines)"
        default: "400000"
      machines:
        description: "Machines en parallèle par passe (20 au plus)"
        default: "16"
      branche:
        description: "Branche de départ (code et données)"
        default: "main"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.5"

jobs:
  preparer:
    name: Préparation
    runs-on: ubuntu-latest
    outputs:
      machines: ${{ steps.liste.outputs.machines }}
    steps:
      - id: liste
        run: python3 -c "import json; print('machines=' + json.dumps(list(range(1, int('${{ inputs.machines }}') + 1))))" >> "$GITHUB_OUTPUT"
  simuler-1:
    name: "Passe 1 : simulation"
    needs: [preparer]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 1 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.preparer.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Combats (deux processus, un par cœur)
        run: |
          par_machine=$(( ${{ inputs.combats }} / ${{ inputs.machines }} ))
          moitie=$(( par_machine / 2 ))
          mkdir -p sims
          for p in 0 1; do
            graine=$(( 1 * 100000 + ${{ matrix.machine }} * 10 + p ))
            timeout 3000 ~/godot/godot --headless --path . --script res://tools/equilibrage.gd -- $moitie $graine sims/passe1_m${{ matrix.machine }}_$p.csv > /dev/null 2>&1 &
          done
          wait
          wc -l sims/*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: sim-1-${{ matrix.machine }}
          path: sims/*.csv
          retention-days: 3

  regler-1:
    name: "Passe 1 : réglage"
    needs: [simuler-1]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Les combats de la passe
        uses: actions/download-artifact@v4
        with:
          pattern: sim-1-*
          path: sims
          merge-multiple: true
      - name: Réglage des chiffres
        run: |
          mkdir -p etat
          echo "## Passe 1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          EQUILIBRAGE_DIR=etat python3 tools/regleur.py regler 1 sims/*.csv | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reglage && cp -r data reglage/ && cp etat/amortissement.json reglage/
      - uses: actions/upload-artifact@v4
        with:
          name: donnees-1
          path: reglage
          retention-days: 30

  simuler-2:
    name: "Passe 2 : simulation"
