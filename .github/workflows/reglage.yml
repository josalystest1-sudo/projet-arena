      - name: La dernière passe
        run: |
          derniere=$(ls -d toutes/donnees-* | sed 's/.*donnees-//' | sort -n | tail -1)
          echo "Dernière passe réglée : $derniere"
          cp -r toutes/donnees-$derniere/data/. data/
          mkdir -p reglage && cp -r data reglage/
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: 48 000 combats neufs, puis le rapport
        run: |
          mkdir -p sims
          for p in 0 1; do
            timeout 3000 ~/godot/godot --headless --path . --script res://tools/equilibrage.gd -- 24000 $(( 900 + p )) sims/verif_$p.csv > /dev/null 2>&1 &
          done
          wait
          python3 tools/equilibrage.py sims/verif_0.csv sims/verif_1.csv > rapport.txt
          echo "## Vérification (48 000 combats neufs)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -1 rapport.txt >> "$GITHUB_STEP_SUMMARY"
          grep -A12 "^Classes (dans le duo)" rapport.txt >> "$GITHUB_STEP_SUMMARY"
          grep "hors fourchette\|kits mesurés" rapport.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rapport
          path: rapport.txt
          retention-days: 30
      - name: Publication sur une branche reglage-<numéro>
        run: |
          git config user.name "Réglage automatique"
          git config user.email "reglage@users.noreply.github.com"
          git checkout -b "reglage-${{ github.run_number }}"
          git add data
          git commit -m "Réglage automatique (run ${{ github.run_number }}, ${{ inputs.passes }} passes de ${{ inputs.combats }} combats)" || echo "rien à publier"
          git push origin "reglage-${{ github.run_number }}"
          echo "Branche publiée : reglage-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
