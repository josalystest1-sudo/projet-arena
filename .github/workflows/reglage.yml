  verifier:
    name: Vérification sur des combats neufs
    needs: [regler-1, regler-2, regler-3, regler-4, regler-5, regler-6]
    if: ${{ !cancelled() && needs.regler-1.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
