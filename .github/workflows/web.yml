name: Export web et publication sur GitHub Pages

on:
  push:
    branches: [main]
  # Aperçu du combat V2 (branche combat-v2, docs/SPEC-COMBAT-V2.md) : chaque fois que ses tests passent après une
  # fusion, le site est republié avec le jeu de main à la racine et celui de combat-v2 sous /v2/. Ce flux tourne
  # depuis main, la seule branche autorisée à publier sur GitHub Pages.
  workflow_run:
    workflows: ["Tests du moteur de règles"]
    types: [completed]
    branches: [combat-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5"

jobs:
  build:
    name: Tests puis export web
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Cache de Godot et des modèles d'export web
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-web-templates

      - name: Téléchargement de Godot et des modèles web
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TEMPLATES=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TEMPLATES"
          unzip -q -j /tmp/templates.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/version.txt -d "$TEMPLATES"
          rm /tmp/templates.tpz

      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import

      - name: Tests (on ne publie jamais une version qui échoue)
        run: timeout 600 ~/godot/godot --headless --path . --script res://tests/run_tests.gd

      - name: Budget de chaque nœud (combat V2, docs/SPEC-COMBAT-V2.md, 7.4)
        run: timeout 120 ~/godot/godot --headless --path . --script res://tools/budget.gd

      - name: Export web
        run: |
          mkdir -p build/web
          timeout 600 ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - name: Aperçu du combat V2 sous /v2/ (si la branche combat-v2 existe et que ses tests passent)
        run: |
          if git ls-remote --exit-code --heads origin combat-v2 > /dev/null; then
            git fetch --depth 1 origin combat-v2
            git worktree add /tmp/v2 FETCH_HEAD
            cd /tmp/v2
            timeout 300 ~/godot/godot --headless --path . --import || true
            if timeout 600 ~/godot/godot --headless --path . --script res://tests/run_tests.gd; then
              mkdir -p "$GITHUB_WORKSPACE/build/web/v2"
              timeout 600 ~/godot/godot --headless --path . --export-release "Web" "$GITHUB_WORKSPACE/build/web/v2/index.html" || rm -rf "$GITHUB_WORKSPACE/build/web/v2"
            else
              echo "Les tests de combat-v2 échouent : pas d'aperçu publié."
            fi
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publication sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
