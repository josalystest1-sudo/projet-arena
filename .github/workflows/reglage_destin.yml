# Réglage des valeurs des nœuds du Destin sur les machines de GitHub (gratuites pour un dépôt public), en parallèle.
# À lancer depuis l'onglet Actions (bouton « Run workflow ») : chaque passe fait jouer des dizaines de milliers de
# combats avec le Destin (les deux duos au même niveau tiré au hasard, points placés au hasard) répartis sur
# plusieurs machines, puis tools/regleur_destin.py corrige les valeurs de data/destin_nodes.json ; les passes
# s'enchaînent. À la fin : une vérification sur des combats neufs (rapport dans le résumé du run) et une branche
# « reglage-destin-<numéro> » qui porte les valeurs réglées, à fusionner dans la branche de travail.
name: Réglage du Destin (simulation sur GitHub)

on:
  workflow_dispatch:
    inputs:
      passes:
        description: "Nombre de passes de réglage (1 à 4)"
        default: "3"
      combats:
        description: "Combats par passe (répartis sur les machines)"
        default: "96000"
      machines:
        description: "Machines en parallèle par passe (20 au plus)"
        default: "12"
      branche:
        description: "Branche de départ (code et données)"
        default: "main"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.5"

jobs:
  preparer:
    name: Préparation
    runs-on: ubuntu-latest
    outputs:
      machines: ${{ steps.liste.outputs.machines }}
    steps:
      - id: liste
        run: python3 -c "import json; print('machines=' + json.dumps(list(range(1, int('${{ inputs.machines }}') + 1))))" >> "$GITHUB_OUTPUT"
  simuler-1:
    name: "Passe 1 : simulation"
    needs: [preparer]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 1 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.preparer.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Combats avec le Destin (deux processus, un par cœur)
        run: |
          par_machine=$(( ${{ inputs.combats }} / ${{ inputs.machines }} ))
          moitie=$(( par_machine / 2 ))
          mkdir -p sims
          for p in 0 1; do
            graine=$(( 1 * 100000 + 50000 + ${{ matrix.machine }} * 10 + p ))
            timeout 3000 ~/godot/godot --headless --path . --script res://tools/equilibrage.gd -- $moitie $graine sims/destin1_m${{ matrix.machine }}_$p.csv alea > /dev/null 2>&1 &
          done
          wait
          wc -l sims/*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: sim-destin-1-${{ matrix.machine }}
          path: sims/*.csv
          retention-days: 3

  regler-1:
    name: "Passe 1 : réglage"
    needs: [simuler-1]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Les combats de la passe
        uses: actions/download-artifact@v4
        with:
          pattern: sim-destin-1-*
          path: sims
          merge-multiple: true
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Réglage des valeurs des nœuds
        run: |
          mkdir -p etat
          echo "## Passe 1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          DESTIN_DIR=etat python3 tools/regleur_destin.py regler 1 sims/*.csv | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reglage && cp -r data reglage/ && cp etat/amortissement_destin.json reglage/
      - uses: actions/upload-artifact@v4
        with:
          name: donnees-destin-1
          path: reglage
          retention-days: 30

  simuler-2:
    name: "Passe 2 : simulation"
    needs: [preparer, regler-1]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 2 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.preparer.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 1
        uses: actions/download-artifact@v4
        with:
          name: donnees-destin-1
          path: reglage
      - name: Mise en place des données réglées
        run: cp -r reglage/data/. data/
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Combats avec le Destin (deux processus, un par cœur)
        run: |
          par_machine=$(( ${{ inputs.combats }} / ${{ inputs.machines }} ))
          moitie=$(( par_machine / 2 ))
          mkdir -p sims
          for p in 0 1; do
            graine=$(( 2 * 100000 + 50000 + ${{ matrix.machine }} * 10 + p ))
            timeout 3000 ~/godot/godot --headless --path . --script res://tools/equilibrage.gd -- $moitie $graine sims/destin2_m${{ matrix.machine }}_$p.csv alea > /dev/null 2>&1 &
          done
          wait
          wc -l sims/*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: sim-destin-2-${{ matrix.machine }}
          path: sims/*.csv
          retention-days: 3

  regler-2:
    name: "Passe 2 : réglage"
    needs: [simuler-2]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 2 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 1
        uses: actions/download-artifact@v4
        with:
          name: donnees-destin-1
          path: reglage
      - name: Mise en place des données réglées
        run: |
          cp -r reglage/data/. data/
          mkdir -p etat && cp reglage/amortissement_destin.json etat/ 2>/dev/null || true
      - name: Les combats de la passe
        uses: actions/download-artifact@v4
        with:
          pattern: sim-destin-2-*
          path: sims
          merge-multiple: true
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Réglage des valeurs des nœuds
        run: |
          mkdir -p etat
          echo "## Passe 2" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          DESTIN_DIR=etat python3 tools/regleur_destin.py regler 2 sims/*.csv | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reglage && cp -r data reglage/ && cp etat/amortissement_destin.json reglage/
      - uses: actions/upload-artifact@v4
        with:
          name: donnees-destin-2
          path: reglage
          retention-days: 30

  simuler-3:
    name: "Passe 3 : simulation"
    needs: [preparer, regler-2]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 3 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.preparer.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 2
        uses: actions/download-artifact@v4
        with:
          name: donnees-destin-2
          path: reglage
      - name: Mise en place des données réglées
        run: cp -r reglage/data/. data/
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Combats avec le Destin (deux processus, un par cœur)
        run: |
          par_machine=$(( ${{ inputs.combats }} / ${{ inputs.machines }} ))
          moitie=$(( par_machine / 2 ))
          mkdir -p sims
          for p in 0 1; do
            graine=$(( 3 * 100000 + 50000 + ${{ matrix.machine }} * 10 + p ))
            timeout 3000 ~/godot/godot --headless --path . --script res://tools/equilibrage.gd -- $moitie $graine sims/destin3_m${{ matrix.machine }}_$p.csv alea > /dev/null 2>&1 &
          done
          wait
          wc -l sims/*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: sim-destin-3-${{ matrix.machine }}
          path: sims/*.csv
          retention-days: 3

  regler-3:
    name: "Passe 3 : réglage"
    needs: [simuler-3]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 3 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 2
        uses: actions/download-artifact@v4
        with:
          name: donnees-destin-2
          path: reglage
      - name: Mise en place des données réglées
        run: |
          cp -r reglage/data/. data/
          mkdir -p etat && cp reglage/amortissement_destin.json etat/ 2>/dev/null || true
      - name: Les combats de la passe
        uses: actions/download-artifact@v4
        with:
          pattern: sim-destin-3-*
          path: sims
          merge-multiple: true
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Réglage des valeurs des nœuds
        run: |
          mkdir -p etat
          echo "## Passe 3" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          DESTIN_DIR=etat python3 tools/regleur_destin.py regler 3 sims/*.csv | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reglage && cp -r data reglage/ && cp etat/amortissement_destin.json reglage/
      - uses: actions/upload-artifact@v4
        with:
          name: donnees-destin-3
          path: reglage
          retention-days: 30

  simuler-4:
    name: "Passe 4 : simulation"
    needs: [preparer, regler-3]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 4 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.preparer.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 3
        uses: actions/download-artifact@v4
        with:
          name: donnees-destin-3
          path: reglage
      - name: Mise en place des données réglées
        run: cp -r reglage/data/. data/
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Combats avec le Destin (deux processus, un par cœur)
        run: |
          par_machine=$(( ${{ inputs.combats }} / ${{ inputs.machines }} ))
          moitie=$(( par_machine / 2 ))
          mkdir -p sims
          for p in 0 1; do
            graine=$(( 4 * 100000 + 50000 + ${{ matrix.machine }} * 10 + p ))
            timeout 3000 ~/godot/godot --headless --path . --script res://tools/equilibrage.gd -- $moitie $graine sims/destin4_m${{ matrix.machine }}_$p.csv alea > /dev/null 2>&1 &
          done
          wait
          wc -l sims/*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: sim-destin-4-${{ matrix.machine }}
          path: sims/*.csv
          retention-days: 3

  regler-4:
    name: "Passe 4 : réglage"
    needs: [simuler-4]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 4 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 3
        uses: actions/download-artifact@v4
        with:
          name: donnees-destin-3
          path: reglage
      - name: Mise en place des données réglées
        run: |
          cp -r reglage/data/. data/
          mkdir -p etat && cp reglage/amortissement_destin.json etat/ 2>/dev/null || true
      - name: Les combats de la passe
        uses: actions/download-artifact@v4
        with:
          pattern: sim-destin-4-*
          path: sims
          merge-multiple: true
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Réglage des valeurs des nœuds
        run: |
          mkdir -p etat
          echo "## Passe 4" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          DESTIN_DIR=etat python3 tools/regleur_destin.py regler 4 sims/*.csv | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reglage && cp -r data reglage/ && cp etat/amortissement_destin.json reglage/
      - uses: actions/upload-artifact@v4
        with:
          name: donnees-destin-4
          path: reglage
          retention-days: 30

  verifier:
    name: Vérification sur des combats neufs
    needs: [regler-1, regler-2, regler-3, regler-4]
    if: ${{ !cancelled() && needs.regler-1.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Toutes les données réglées
        uses: actions/download-artifact@v4
        with:
          pattern: donnees-destin-*
          path: toutes
      - name: La dernière passe
        run: |
          derniere=$(ls -d toutes/donnees-destin-* | sed 's/.*donnees-destin-//' | sort -n | tail -1)
          echo "Dernière passe réglée : $derniere"
          cp -r toutes/donnees-destin-$derniere/data/. data/
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: 24 000 combats neufs avec le Destin, puis le rapport
        run: |
          mkdir -p sims
          for p in 0 1; do
            timeout 3000 ~/godot/godot --headless --path . --script res://tools/equilibrage.gd -- 12000 $(( 950 + p )) sims/verif_$p.csv alea > /dev/null 2>&1 &
          done
          wait
          python3 tools/equilibrage.py sims/verif_0.csv sims/verif_1.csv > rapport.txt
          echo "## Vérification (24 000 combats neufs avec le Destin)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -1 rapport.txt >> "$GITHUB_STEP_SUMMARY"
          grep -A40 "^Niveaux" rapport.txt >> "$GITHUB_STEP_SUMMARY"
          grep -A30 "^Nœuds du Destin pris (joueur)" rapport.txt >> "$GITHUB_STEP_SUMMARY"
          grep -A30 "^Nœuds du Destin pris (acolyte)" rapport.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-destin
          path: rapport.txt
          retention-days: 30
      - name: Publication sur une branche reglage-destin-<numéro>
        run: |
          git config user.name "Réglage automatique"
          git config user.email "reglage@users.noreply.github.com"
          git checkout -b "reglage-destin-${{ github.run_number }}"
          git add data
          git commit -m "Réglage automatique du Destin (run ${{ github.run_number }}, ${{ inputs.passes }} passes de ${{ inputs.combats }} combats)" || echo "rien à publier"
          git push origin "reglage-destin-${{ github.run_number }}"
          echo "Branche publiée : reglage-destin-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
