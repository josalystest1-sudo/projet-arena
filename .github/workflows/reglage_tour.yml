# Réglage de la Tour sur les machines de GitHub : chaque passe fait monter des duos tirés au hasard sur plusieurs
# machines, puis tools/menace.py règle la menace de chaque monstre et tools/regleur_tour.py la difficulté de chaque
# étage (data/bestiaire.json, data/tower.json). À la fin, la branche « reglage-tour-<numéro> » porte les données réglées.
name: Réglage de la Tour (simulation sur GitHub)

on:
  workflow_dispatch:
    inputs:
      passes:
        description: "Nombre de passes (1 à 4)"
        default: "3"
      montees:
        description: "Montées par passe (réparties sur les machines)"
        default: "6000"
      machines:
        description: "Machines en parallèle par passe (20 au plus)"
        default: "12"
      branche:
        description: "Branche de départ (code et données)"
        default: "main"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.5"

jobs:
  preparer:
    name: Préparation
    runs-on: ubuntu-latest
    outputs:
      machines: ${{ steps.liste.outputs.machines }}
    steps:
      - id: liste
        run: python3 -c "import json; print('machines=' + json.dumps(list(range(1, int('${{ inputs.machines }}') + 1))))" >> "$GITHUB_OUTPUT"
  simuler-1:
    name: "Passe 1 : montées"
    needs: [preparer]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 1 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.preparer.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Montées (deux processus, un par cœur)
        run: |
          par_machine=$(( ${{ inputs.montees }} / ${{ inputs.machines }} ))
          moitie=$(( par_machine / 2 ))
          mkdir -p sims
          for p in 0 1; do
            graine=$(( 1 * 100000 + ${{ matrix.machine }} * 10 + p ))
            timeout 3000 ~/godot/godot --headless --path . --script res://tools/simulate_tour.gd -- $moitie $graine sims/tour1_m${{ matrix.machine }}_$p.csv > /dev/null 2>&1 &
          done
          wait
          wc -l sims/*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: montees-1-${{ matrix.machine }}
          path: sims/*.csv
          retention-days: 3

  regler-1:
    name: "Passe 1 : réglage"
    needs: [simuler-1]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Les montées de la passe
        uses: actions/download-artifact@v4
        with:
          pattern: montees-1-*
          path: sims
          merge-multiple: true
      - name: Menace des monstres, puis difficulté des étages
        run: |
          echo "## Passe 1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/menace.py sims/*.csv --ecrire | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/regleur_tour.py regler 1 sims/*.csv | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reglage && cp -r data reglage/
      - uses: actions/upload-artifact@v4
        with:
          name: tour-1
          path: reglage
          retention-days: 30

  simuler-2:
    name: "Passe 2 : montées"
    needs: [preparer, regler-1]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 2 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.preparer.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 1
        uses: actions/download-artifact@v4
        with:
          name: tour-1
          path: reglage
      - name: Mise en place des données réglées
        run: cp -r reglage/data/. data/
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Montées (deux processus, un par cœur)
        run: |
          par_machine=$(( ${{ inputs.montees }} / ${{ inputs.machines }} ))
          moitie=$(( par_machine / 2 ))
          mkdir -p sims
          for p in 0 1; do
            graine=$(( 2 * 100000 + ${{ matrix.machine }} * 10 + p ))
            timeout 3000 ~/godot/godot --headless --path . --script res://tools/simulate_tour.gd -- $moitie $graine sims/tour2_m${{ matrix.machine }}_$p.csv > /dev/null 2>&1 &
          done
          wait
          wc -l sims/*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: montees-2-${{ matrix.machine }}
          path: sims/*.csv
          retention-days: 3

  regler-2:
    name: "Passe 2 : réglage"
    needs: [simuler-2]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 2 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 1
        uses: actions/download-artifact@v4
        with:
          name: tour-1
          path: reglage
      - name: Mise en place des données réglées
        run: cp -r reglage/data/. data/
      - name: Les montées de la passe
        uses: actions/download-artifact@v4
        with:
          pattern: montees-2-*
          path: sims
          merge-multiple: true
      - name: Menace des monstres, puis difficulté des étages
        run: |
          echo "## Passe 2" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/menace.py sims/*.csv --ecrire | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/regleur_tour.py regler 2 sims/*.csv | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reglage && cp -r data reglage/
      - uses: actions/upload-artifact@v4
        with:
          name: tour-2
          path: reglage
          retention-days: 30

  simuler-3:
    name: "Passe 3 : montées"
    needs: [preparer, regler-2]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 3 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.preparer.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 2
        uses: actions/download-artifact@v4
        with:
          name: tour-2
          path: reglage
      - name: Mise en place des données réglées
        run: cp -r reglage/data/. data/
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Montées (deux processus, un par cœur)
        run: |
          par_machine=$(( ${{ inputs.montees }} / ${{ inputs.machines }} ))
          moitie=$(( par_machine / 2 ))
          mkdir -p sims
          for p in 0 1; do
            graine=$(( 3 * 100000 + ${{ matrix.machine }} * 10 + p ))
            timeout 3000 ~/godot/godot --headless --path . --script res://tools/simulate_tour.gd -- $moitie $graine sims/tour3_m${{ matrix.machine }}_$p.csv > /dev/null 2>&1 &
          done
          wait
          wc -l sims/*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: montees-3-${{ matrix.machine }}
          path: sims/*.csv
          retention-days: 3

  regler-3:
    name: "Passe 3 : réglage"
    needs: [simuler-3]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 3 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 2
        uses: actions/download-artifact@v4
        with:
          name: tour-2
          path: reglage
      - name: Mise en place des données réglées
        run: cp -r reglage/data/. data/
      - name: Les montées de la passe
        uses: actions/download-artifact@v4
        with:
          pattern: montees-3-*
          path: sims
          merge-multiple: true
      - name: Menace des monstres, puis difficulté des étages
        run: |
          echo "## Passe 3" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/menace.py sims/*.csv --ecrire | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/regleur_tour.py regler 3 sims/*.csv | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reglage && cp -r data reglage/
      - uses: actions/upload-artifact@v4
        with:
          name: tour-3
          path: reglage
          retention-days: 30

  simuler-4:
    name: "Passe 4 : montées"
    needs: [preparer, regler-3]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 4 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.preparer.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 3
        uses: actions/download-artifact@v4
        with:
          name: tour-3
          path: reglage
      - name: Mise en place des données réglées
        run: cp -r reglage/data/. data/
      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Téléchargement de Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import du projet
        run: timeout 300 ~/godot/godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Montées (deux processus, un par cœur)
        run: |
          par_machine=$(( ${{ inputs.montees }} / ${{ inputs.machines }} ))
          moitie=$(( par_machine / 2 ))
          mkdir -p sims
          for p in 0 1; do
            graine=$(( 4 * 100000 + ${{ matrix.machine }} * 10 + p ))
            timeout 3000 ~/godot/godot --headless --path . --script res://tools/simulate_tour.gd -- $moitie $graine sims/tour4_m${{ matrix.machine }}_$p.csv > /dev/null 2>&1 &
          done
          wait
          wc -l sims/*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: montees-4-${{ matrix.machine }}
          path: sims/*.csv
          retention-days: 3

  regler-4:
    name: "Passe 4 : réglage"
    needs: [simuler-4]
    if: ${{ !cancelled() && needs.preparer.result == 'success' && fromJSON(inputs.passes) >= 4 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Données réglées par la passe 3
        uses: actions/download-artifact@v4
        with:
          name: tour-3
          path: reglage
      - name: Mise en place des données réglées
        run: cp -r reglage/data/. data/
      - name: Les montées de la passe
        uses: actions/download-artifact@v4
        with:
          pattern: montees-4-*
          path: sims
          merge-multiple: true
      - name: Menace des monstres, puis difficulté des étages
        run: |
          echo "## Passe 4" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/menace.py sims/*.csv --ecrire | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/regleur_tour.py regler 4 sims/*.csv | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reglage && cp -r data reglage/
      - uses: actions/upload-artifact@v4
        with:
          name: tour-4
          path: reglage
          retention-days: 30

  publier:
    name: Publication sur une branche reglage-tour-<numéro>
    needs: [regler-1, regler-2, regler-3, regler-4]
    if: ${{ !cancelled() && needs.regler-1.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
      - name: Toutes les données réglées
        uses: actions/download-artifact@v4
        with:
          pattern: tour-*
          path: toutes
      - name: La dernière passe, puis la branche
        run: |
          derniere=$(ls -d toutes/tour-* | sed 's/.*tour-//' | sort -n | tail -1)
          cp -r toutes/tour-$derniere/data/. data/
          git config user.name "Réglage automatique"
          git config user.email "reglage@users.noreply.github.com"
          git checkout -b "reglage-tour-${{ github.run_number }}"
          git add data
          git commit -m "Réglage automatique de la Tour (run ${{ github.run_number }}, ${{ inputs.passes }} passes de ${{ inputs.montees }} montées)" || echo "rien à publier"
          git push origin "reglage-tour-${{ github.run_number }}"
          echo "Branche publiée : reglage-tour-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
